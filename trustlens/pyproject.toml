[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens"
version = "0.1.0"
description = "TrustLens: contributor-level integrity assurance for CV data, models and inference outputs (SIH PS 26228)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=2.24",
  "faiss-cpu>=1.8",
  "imagehash>=4.3",
  "cleanlab>=2.6",
  "scikit-learn>=1.4",
  "adversarial-robustness-toolbox>=1.17",
  "model-signing>=1.0",
  "cryptography>=42",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "streamlit>=1.36",
  "altair>=5",
  "typer>=0.12",
  "pyyaml>=6",
  "pillow>=10",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trustlens = "trustlens.cli:app"

[tool.setuptools.packages.find]
include = ["trustlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
